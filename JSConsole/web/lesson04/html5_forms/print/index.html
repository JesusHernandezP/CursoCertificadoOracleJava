<!DOCTYPE html>
<html>
  <head>
    <title>The Next Big Front-End Conference</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <script src="code.js"></script>
  </head>
  <body>
    <header>
      <h1>The Next Big Conference for Front-End Developers</h1>
      <h2>Join us this year</h2>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#section-1">Speakers</a></li>
          <li><a href="#section-2">Workshops</a></li>
          <li><a href="#section-3">Submit Proposal</a></li>
        </ul>  
      </nav>
    </header>
    <section id="section-1">
      <article>
        <header>
          <h2>Speakers</h2>
        </header>
        <p>Text</p>
      </article>
    </section>
    <section id="section-2">
      <article>
        <header>
          <h2>Workshops</h2>
        </header>
        <p>Text</p>
      </article>
    </section>
    <section id="section-3">
      <article>
        <header>
          <h2>Submit Proposal</h2>
        </header>
        <p>
          Fill in the form below to send your proposal:    
        </p>
        <form name="proposalForm" action="#">
          <fieldset>
            <p>
              <label for="name">Name:(required)</label>
              <input type="text" name="name" id="name">
            </p>
            <p>
              <label for="email">Email:(required)</label>
              <input type="email" name="email" id="email">
            </p>
            <p>
              <label for="telephone">Telephone:</label>
              <input type="tel" name="telephone" id="telephone">
            </p>
            <p><label for="abstract">Abstract:(required)</label></p>
            <textarea rows="5" cols="80" name="abstract" id="abstract"></textarea>
            <p><label for="file">Or you can send us a document with the abstract:</label></p>
            <input type="file" name="file" id="file">
            <p><input type="submit" name="submit" value="submit"></p>
          </fieldset>
        </form>
      </article>
    </section>
    <aside>
      <h2>Ads</h2>
      <p>UI/UX advertising</p>
    </aside>
    <footer>
      <p>&copy; 2014 Front End User Groups</p>
    </footer>
  </body> 
</html>
